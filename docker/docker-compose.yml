# ARVIS on the shared Hostinger VPS: ONE container only. Everything heavy runs in GitHub
# Actions (see .github/workflows). Run as the `arvis` user from /opt/arvis/docker:
#   docker compose up -d
#
# Rules: port bound to 127.0.0.1 only; resource limit set; the daemon's cgroup-parent
# (vps/02) puts it under arvis.slice; nothing touches PM2 / armedias.com / ports 80/443.

name: arvis

services:

  # --- Reacher: self-hosted email verification ---------------------------------
  # POST http://127.0.0.1:8081/v0/check_email {"to_email": "..."}
  # Needs OUTBOUND PORT 25. If Hostinger blocks it every result is "unknown";
  # enrich-verify then falls back to Hunter.io verification (free 50/mo).
  reacher:
    image: reacherhq/backend:latest
    container_name: arvis-reacher
    restart: unless-stopped
    environment:
      RUST_LOG: info
      RCH__BACKEND_NAME: arvis
      RCH__FROM_EMAIL: ${REACHER_FROM_EMAIL:-verify@mail.armedias.tech}
      RCH__HELLO_NAME: ${REACHER_HELLO_NAME:-mail.armedias.tech}
      RCH__SMTP_TIMEOUT: "20"
      RCH__HTTP_HOST: 0.0.0.0
      RCH__HTTP_PORT: "8080"
      RCH__WORKER__ENABLE: "false"
    ports: [ "127.0.0.1:8081:8080" ]
    security_opt: [ "no-new-privileges:true" ]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { cpus: "0.20", memory: "256M" }
