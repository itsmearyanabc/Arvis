  #   <<: *common
  #   image: calcom/cal.com:latest
  #   container_name: arvis-calcom
  #   profiles: [ "booking" ]
  #   depends_on: [ calcom-db ]
  #   environment:
  #     NEXT_PUBLIC_WEBAPP_URL: https://book.armedias.tech
  #     NEXTAUTH_URL: https://book.armedias.tech
  #     NEXTAUTH_SECRET: ${CALCOM_NEXTAUTH_SECRET}
  #     CALENDSO_ENCRYPTION_KEY: ${CALCOM_ENCRYPTION_KEY}
