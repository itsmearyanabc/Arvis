# ARVIS supporting services. Run as the `arvis` user from /opt/arvis/docker:
#   docker compose --profile core up -d                 # reacher + searxng (always on, tiny)
#   docker compose --profile scrape up -d scraper       # cron starts it for the 02:00-05:00 window, then stops it
#   (Uptime Kuma is NOT run here: monitoring armedias.com from its own box is pointless; use
#    free UptimeRobot. Cal.com: use the free hosted plan, see Phase 4.)
#
# Rules baked in:
#   - every port is bound to 127.0.0.1 only; Nginx (docker/nginx/arvis.conf) is the only public door
#   - every service has deploy.resources.limits; the daemon's cgroup-parent (vps/02) puts them all
#     under arvis.slice, so the slice cap is the real ceiling even if these add up to more
#   - no service touches PM2 / armedias.com; nothing listens on 80/443
#
# Sizing for the SHARED 1 vCPU / 3.8 GiB Hostinger box: limits below total ≈ 0.8 cpu /
# 1.3 GiB with the scraper running, inside the 50% / 1.5G arvis.slice from vps/01
# (the slice is the real ceiling; Hermes itself is <300 MB).

name: arvis

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  security_opt: [ "no-new-privileges:true" ]

services:

  # --- Google Maps scraper (lead source #1) -----------------------------------
  # Web UI + REST API. Profile "scrape": cron starts it only for the nightly window.
  # `-c 1` = ONE headless browser at a time (shared box).
  scraper:
    <<: *common
    image: gosom/google-maps-scraper:latest
    container_name: arvis-scraper
    profiles: [ "scrape" ]
    command: [ "-web", "-data-folder", "/data", "-c", "1" ]
    ports: [ "127.0.0.1:8082:8080" ]
    volumes: [ "../data/scraper:/data" ]
    shm_size: "512m"
    deploy:
      resources:
        limits: { cpus: "0.40", memory: "800M" }
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1" ]
      interval: 60s
      timeout: 5s
      retries: 3

  # --- Reacher: self-hosted email verification -------------------------------
  # POST http://127.0.0.1:8081/v0/check_email {"to_email": "..."}
  reacher:
    <<: *common
    image: reacherhq/backend:latest
    container_name: arvis-reacher
    profiles: [ "core" ]
    environment:
      RUST_LOG: info
      RCH__BACKEND_NAME: arvis
      RCH__FROM_EMAIL: ${REACHER_FROM_EMAIL:-verify@mail.armedias.tech}
      RCH__HELLO_NAME: ${REACHER_HELLO_NAME:-mail.armedias.tech}
      RCH__SMTP_TIMEOUT: "20"
      RCH__HTTP_HOST: 0.0.0.0
      RCH__HTTP_PORT: "8080"
      RCH__WORKER__ENABLE: "false"
    ports: [ "127.0.0.1:8081:8080" ]
    deploy:
      resources:
        limits: { cpus: "0.20", memory: "256M" }
    # NOTE: SMTP verification needs outbound port 25. Hostinger blocks it on some plans;
    # if "is_reachable: unknown" for everything, fall back to Hunter.io verification.

  # --- SearXNG: self-hosted meta-search (free public web lookup) ---------------
  # GET http://127.0.0.1:8080/search?q=...&format=json
  searxng:
    <<: *common
    image: searxng/searxng:latest
    container_name: arvis-searxng
    profiles: [ "core" ]
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-run-openssl-rand-hex-32}
    ports: [ "127.0.0.1:8080:8080" ]
    volumes: [ "./searxng:/etc/searxng:rw" ]
    cap_drop: [ "ALL" ]
    cap_add: [ "CHOWN", "SETGID", "SETUID" ]
    deploy:
      resources:
        limits: { cpus: "0.20", memory: "256M" }

  # --- Uptime Kuma: website monitoring -----------------------------------------
  # Profile "monitor": NOT started on the shared box (it would monitor armedias.com from
  # armedias.com's own server). monitor-site uses free UptimeRobot instead. Kept for a
  # future dedicated box.
  uptime-kuma:
    <<: *common
    image: louislam/uptime-kuma:1
    container_name: arvis-uptime-kuma
    profiles: [ "monitor" ]
    ports: [ "127.0.0.1:3001:3001" ]
    volumes: [ "../data/uptime-kuma:/app/data" ]
    deploy:
      resources:
        limits: { cpus: "0.20", memory: "256M" }

  # --- Cal.com: self-hosted booking (Phase 4) -----------------------------------
  # Needs Postgres + ~1.5 GiB RAM: does NOT fit the shared 3.8 GiB box next to armedias.com.
  # Phase 4 uses Cal.com's free hosted plan with book.armedias.tech as a CNAME instead.
  # Kept here, commented out, for a future dedicated box.
  #
  # calcom-db:
  #   <<: *common
  #   image: postgres:16-alpine
  #   container_name: arvis-calcom-db
  #   profiles: [ "booking" ]
  #   environment:
  #     POSTGRES_USER: calcom
  #     POSTGRES_PASSWORD: ${CALCOM_DB_PASSWORD}
  #     POSTGRES_DB: calcom
  #   volumes: [ "../data/calcom-db:/var/lib/postgresql/data" ]
  #   deploy:
  #     resources:
  #       limits: { cpus: "0.30", memory: "384M" }
