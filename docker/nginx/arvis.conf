# ARVIS — separate Nginx server blocks for the armedias.tech subdomains.
#
# Install:  sudo cp arvis.conf /etc/nginx/sites-available/arvis.conf
#           sudo ln -s /etc/nginx/sites-available/arvis.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx     # reload, never restart
# Then:     sudo certbot --nginx -d arvis.armedias.tech -d book.armedias.tech
#
# This goes on the DEDICATED ARVIS VPS (fresh nginx: `sudo apt install nginx certbot
# python3-certbot-nginx`). armedias.com's server and its nginx are never touched.
# DNS: A records for arvis.armedias.tech and book.armedias.tech -> the ARVIS VPS IP.

# ---- arvis.armedias.tech : lead dashboard / Uptime Kuma (basic-auth protected) ----
server {
    listen 80;
    listen [::]:80;
    server_name arvis.armedias.tech;
    # certbot will add the 443 block + redirect.

    access_log /var/log/nginx/arvis.access.log;
    error_log  /var/log/nginx/arvis.error.log;

    # Create with: sudo apt install apache2-utils && sudo htpasswd -c /etc/nginx/.arvis_htpasswd aryan
    auth_basic           "ARVIS";
    auth_basic_user_file /etc/nginx/.arvis_htpasswd;

    # Phase 7: dashboard app (replace port when it exists). Until then: Uptime Kuma.
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---- book.armedias.tech : Cal.com (Phase 4, self-hosted) --------------
# If you use Cal.com's hosted plan instead, point book.armedias.tech at it with a CNAME
# and delete this block.
server {
    listen 80;
    listen [::]:80;
    server_name book.armedias.tech;

    access_log /var/log/nginx/book.access.log;
    error_log  /var/log/nginx/book.error.log;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
