# ARVIS — separate Nginx server blocks for the armedias.tech subdomains.
#
# Install:  sudo cp arvis.conf /etc/nginx/sites-available/arvis.conf
#           sudo ln -s /etc/nginx/sites-available/arvis.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx     # reload, never restart
# Then:     sudo certbot --nginx -d arvis.armedias.tech -d book.armedias.tech
#
# This file ADDS one server block next to the existing armedias.com block. It does not
# modify that block; `nginx -t && systemctl reload nginx` is a zero-downtime config re-read.
# DNS: A record for arvis.armedias.tech -> this VPS IP.
# book.armedias.tech is a CNAME to Cal.com's hosted plan (Phase 4), not served here.

# ---- arvis.armedias.tech : lead dashboard / Uptime Kuma (basic-auth protected) ----
server {
    listen 80;
    listen [::]:80;
    server_name arvis.armedias.tech;
    # certbot will add the 443 block + redirect.

    access_log /var/log/nginx/arvis.access.log;
    error_log  /var/log/nginx/arvis.error.log;

    # Create with: sudo apt install apache2-utils && sudo htpasswd -c /etc/nginx/.arvis_htpasswd aryan
    auth_basic           "ARVIS";
    auth_basic_user_file /etc/nginx/.arvis_htpasswd;

    # Phase 7: dashboard app on 127.0.0.1:3000 (ARVIS lead dashboard). Returns 502 until it exists.
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---- book.armedias.tech ------------------------------------------------------------
# Hosted Cal.com (free plan): add a CNAME book.armedias.tech -> cname.cal.com in DNS and set
# the custom domain in Cal.com settings. No server block needed here. If Cal.com is ever
# self-hosted on a dedicated box, copy the block above with proxy_pass to 127.0.0.1:3002.
