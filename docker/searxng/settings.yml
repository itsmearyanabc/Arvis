# Minimal SearXNG config for ARVIS: JSON output on, no UI needed, few engines, low load.
use_default_settings: true
general:
  instance_name: arvis-search
  debug: false
server:
  secret_key: "change-me-run-openssl-rand-hex-32"
  limiter: false
  image_proxy: false
search:
  safe_search: 0
  formats: [ html, json ]
  default_lang: en
engines:
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: google
    disabled: true   # google blocks shared VPS IPs fast; keep Brave API for google-like coverage
outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
  pool_connections: 20
  pool_maxsize: 5
