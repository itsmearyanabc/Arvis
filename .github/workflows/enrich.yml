# Nightly enrichment on a GitHub runner, after the audit: owner names + emails from public
# sources (business website pages, Brave Search snippets, Hunter free tier). Verification of the
# addresses happens on the VPS with self-hosted Reacher (arvisctl verify), not here.
name: enrich
on:
  schedule:
    - cron: "0 0 * * *"          # 05:30 IST
  workflow_dispatch:
    inputs:
      limit:
        description: "max businesses"
        required: false
        default: "30"
concurrency:
  group: enrich
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
      GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      LIMIT: ${{ github.event.inputs.limit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r workers/requirements.txt -r workers/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -I workers/enrich/enrich.py "${LIMIT:-30}"
