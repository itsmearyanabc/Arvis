# Nightly Google Maps scrape on a GitHub runner (free). Zero load on the VPS.
# The brain dispatches this via the GitHub API (workflow_dispatch) or it runs on schedule.
name: scrape
on:
  schedule:
    - cron: "30 20 * * *"        # 02:00 IST
  workflow_dispatch:
    inputs:
      market_id:
        description: "market to scrape (blank = oldest active)"
        required: false
        default: ""
      max_results:
        description: "max results per query"
        required: false
        default: "60"
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      MARKET_ID: ${{ github.event.inputs.market_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r workers/requirements.txt
      - name: Build queries from active markets
        id: q
        run: |
          python -I workers/scrape/make_queries.py "$MARKET_ID"
          python -I workers/scrape/start_run.py "$(cat market.txt)"
          echo "market_id=$(cat market.txt)" >> "$GITHUB_OUTPUT"
          echo "run_id=$(cat run_id.txt)" >> "$GITHUB_OUTPUT"
          cat queries.txt
      - name: Run gosom/google-maps-scraper
        run: |
          docker run --rm -v "$PWD:/work" gosom/google-maps-scraper:latest \
            -input /work/queries.txt -results /work/results.csv \
            -c 2 -depth 1 -exit-on-inactivity 3m -lang en
          wc -l results.csv
      - name: Upload to Supabase
        run: python -I workers/scrape/upload.py results.csv "${{ steps.q.outputs.market_id }}" "${{ steps.q.outputs.run_id }}"
      - name: Mirror new leads to Google Sheets (skips if not configured)
        run: python -I -m workers.common.sheets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "results-${{ github.run_id }}"
          path: results.csv
          retention-days: 7
