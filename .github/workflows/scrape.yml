# Nightly Google Maps scrape on GitHub runners (free). Zero load on the VPS.
# pick: chooses the 3 active markets scraped longest ago -> scrape: one runner per market,
# in parallel, with website email extraction -> mirror: new leads to Google Sheets, one tab
# per niche group (skips until GOOGLE_SERVICE_ACCOUNT_JSON + GOOGLE_SHEET_ID secrets exist).
name: scrape
on:
  schedule:
    - cron: "30 20 * * *"        # 02:00 IST
  workflow_dispatch:
    inputs:
      market_id:
        description: "scrape only this market (blank = 3 oldest active)"
        required: false
        default: ""
      count:
        description: "how many markets tonight"
        required: false
        default: "3"
concurrency:
  group: scrape
  cancel-in-progress: false
env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      markets: ${{ steps.p.outputs.markets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r workers/requirements.txt
      - id: p
        env:
          COUNT: ${{ github.event.inputs.count }}
          MARKET_ID: ${{ github.event.inputs.market_id }}
        run: |
          python -I workers/scrape/pick_markets.py "${COUNT:-3}" "$MARKET_ID"
          echo "markets=$(cat markets.json)" >> "$GITHUB_OUTPUT"
  scrape:
    needs: pick
    if: ${{ needs.pick.outputs.markets != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        market: ${{ fromJson(needs.pick.outputs.markets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r workers/requirements.txt
      - name: Build queries
        run: |
          python -I workers/scrape/make_queries.py "${{ matrix.market }}"
          python -I workers/scrape/start_run.py "${{ matrix.market }}"
          cat queries.txt
      - name: Run gosom/google-maps-scraper (with website email extraction)
        run: |
          docker run --rm -v "$PWD:/work" gosom/google-maps-scraper:latest \
            -input /work/queries.txt -results /work/results.csv \
            -c 2 -depth 1 -email -exit-on-inactivity 4m -lang en
          wc -l results.csv
      - name: Upload to Supabase
        run: python -I workers/scrape/upload.py results.csv "${{ matrix.market }}" "$(cat run_id.txt)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "results-${{ matrix.market }}-${{ github.run_id }}"
          path: results.csv
          retention-days: 7
  mirror:
    needs: scrape
    if: ${{ always() && needs.scrape.result != 'skipped' }}
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r workers/requirements.txt
      - run: python -I workers/common/sheets.py
